{% extends 'store/base.html' %}

{% block content %}
<div class="text-center py-5">
    <h1 class="text-success">Thank You for Your Order!</h1>
    <p class="lead">Your order <strong>#{{ order.id }}</strong> has been placed successfully.</p>
    <p>A confirmation email will be sent to <strong>{{ order.email }}</strong>.</p>
    <a href="{% url 'product_list' %}" class="btn btn-primary mt-3">Back to Store</a>
</div>
{% endblock %}
